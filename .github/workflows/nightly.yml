name: nightly

on:
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    name: e2e (full matrix)
    uses: ./.github/workflows/e2e.yml
    with:
      full_matrix: true

  flake-hunt:
    name: flake hunt (-race -count=10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=10 -timeout=25m ./...

  fuzz:
    name: fuzz (10m per target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Discover and run fuzz targets
        run: |
          set -euo pipefail
          found=0
          while read -r pkg; do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep -E '^Fuzz' || true); do
              found=1
              echo "::group::$pkg $fn"
              go test -run='^$' -fuzz="^${fn}$" -fuzztime=10m "$pkg"
              echo "::endgroup::"
            done
          done < <(go list ./...)
          if [ "$found" -eq 0 ]; then
            echo "::notice::no FuzzXxx targets found - see docs/ci.md for the suggested targets"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        run: go test -run='^$' -bench=. -benchmem ./... | tee bench.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench
          path: bench.txt
          if-no-files-found: warn

  go-tip:
    name: go tip
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
      - run: go build ./... && go test ./...

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 './**/*.md'
          fail: true

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          skip: ./.git,./go.sum,./THIRD_PARTY_LICENSES.csv,./NOTICE,./docs/*.svg,./docs/*.gif,./docs/*.png
          ignore_words_list: aks,noes,keypair,iam
