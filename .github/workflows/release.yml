name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      full_matrix: true

  binaries:
    name: binaries (GoReleaser)
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: manager image (GHCR)
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/groma-manager:${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}/groma-manager:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest }}
          provenance: mode=max
          sbom: true

      - name: Sign the image keylessly
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: |
          cosign sign --yes "${IMAGE%%:*}@${DIGEST}"

      - name: Attach an SBOM attestation to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: |
          syft_img="${IMAGE%%:*}@${DIGEST}"
          cosign download sbom "$syft_img" > image-sbom.spdx.json 2>/dev/null || true
          if [ -s image-sbom.spdx.json ]; then
            cosign attest --yes --predicate image-sbom.spdx.json --type spdxjson "$syft_img"
          fi

  verify:
    name: verify published artifacts
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign verify-blob on checksums.txt
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${REF_NAME}"
          curl -sSLf -o checksums.txt      "${base}/checksums.txt"
          curl -sSLf -o checksums.txt.sig  "${base}/checksums.txt.sig"
          curl -sSLf -o checksums.txt.pem  "${base}/checksums.txt.pem"
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
