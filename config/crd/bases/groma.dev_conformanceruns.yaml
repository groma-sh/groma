---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: conformanceruns.groma.dev
spec:
  group: groma.dev
  names:
    kind: ConformanceRun
    listKind: ConformanceRunList
    plural: conformanceruns
    shortNames:
    - cr
    singular: conformancerun
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.result
      name: Result
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A single execution of an intent's assertions, run once.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              evidence:
                description: Attestation signing; copied from the schedule, Retain
                  ignored here.
                properties:
                  keyRef:
                    description: Cosign key reference (KMS URI or in-cluster secret)
                      when not Keyless.
                    type: string
                  keyless:
                    description: Sign via Sigstore (Fulcio + Rekor); when false, KeyRef
                      must be set.
                    type: boolean
                  retain:
                    description: How long to keep runs and evidence; empty keeps forever.
                    type: string
                  sign:
                    description: Enable in-toto attestation signing; when false, only
                      statement and HTML are stored.
                    type: boolean
                  sink:
                    description: |-
                      Where to publish evidence in addition to the in-cluster ConfigMap. A
                      failed publish never fails the run: the conformance result is already
                      determined by then, and losing it to a registry outage would be worse
                      than an unpublished artifact.
                    properties:
                      bucket:
                        description: Bucket is the object-storage bucket for types
                          "s3" and "gcs".
                        type: string
                      path:
                        description: Path is the directory for type "file", typically
                          a mounted volume.
                        type: string
                      prefix:
                        description: |-
                          Prefix is the key prefix objects are written under; each run gets its own
                          directory beneath it.
                        type: string
                      region:
                        description: |-
                          Region is the AWS region for type "s3"; when empty the ambient AWS
                          configuration supplies it.
                        type: string
                      repo:
                        description: |-
                          Repo is the OCI repository, without a tag, for type "oci"
                          (for example "registry.example.com/groma/evidence").
                        type: string
                      type:
                        description: Type selects the backend.
                        enum:
                        - oci
                        - s3
                        - gcs
                        - file
                        type: string
                    required:
                    - type
                    type: object
                type: object
              intentRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              mode:
                description: Mode defaults to ["active"] when empty. List both to
                  reconcile config vs runtime.
                items:
                  description: 'Mode: "active" (probe), "static" (analyze), or both
                    (reconcile). Empty defaults to ["active"].'
                  type: string
                type: array
              probeStrategy:
                description: Carries the schedule's strategy down to the run so it
                  is self-contained.
                properties:
                  image:
                    type: string
                  maxConcurrentProbes:
                    format: int32
                    type: integer
                  retries:
                    format: int32
                    type: integer
                type: object
            required:
            - intentRef
            type: object
          status:
            properties:
              assertionsFailed:
                format: int32
                type: integer
              assertionsIndeterminate:
                format: int32
                type: integer
              assertionsPassed:
                format: int32
                type: integer
              completionTime:
                format: date-time
                type: string
              conditions:
                description: |-
                  "Complete", "Sound", "EnforcementMatchesConfig" (False = enforcement gap),
                  "AttestationSigned", and "EvidencePublished".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              evidenceRef:
                description: ConfigMap (in the manager's namespace) holding the full
                  JSON evidence report.
                type: string
              evidenceSinkRef:
                description: |-
                  Reference to the published evidence when spec.evidence.sink is set: a
                  digest-pinned OCI reference, or a storage URI.
                type: string
              phase:
                type: string
              result:
                description: Result mirrors internal/evidence.Result.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
