apiVersion: v1
kind: Namespace
metadata:
  name: cde
  labels:
    zone: cde
    # Pod Security Admission "restricted": proves Groma's probe pods schedule
    # on locked-down namespaces, the norm on real clusters.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    zone: frontend
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
